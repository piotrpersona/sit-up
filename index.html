<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posture Guard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Posture Guard</h1>
      <p class="hint">Runs fully in your browser. Video never leaves your device. Keep this tab visible, browsers slow down hidden tabs.</p>

      <div id="stage" class="stage abstract">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="status" class="status idle">Press Start</div>
      </div>

      <section class="controls">
        <div class="row">
          <button id="start" type="button">Start</button>
          <button id="calibrate" type="button" disabled>Calibrate good posture</button>
          <button id="stop" type="button" class="danger" disabled>Stop</button>
        </div>
        <label class="check">
          <input type="checkbox" id="showCamera" />
          Show camera picture (off: black background with body shape)
        </label>
        <div id="metrics" class="metrics"></div>
      </section>
    </main>
    <dialog id="dialog">
      <h2 id="dialogTitle"></h2>
      <p id="dialogBody"></p>
      <form method="dialog"><button type="submit">OK</button></form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
